<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="AI掌柜" />
  <meta name="theme-color" content="#b4532a" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏮</text></svg>" />
  <title>巷子里的AI掌柜</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <div id="page-wrap">
    <div id="app"></div>

    <nav class="tabbar">
      <a class="tab-item" data-route="home">
        <span class="tab-icon">🗣️</span><span class="tab-label">记账</span>
      </a>
      <a class="tab-item" data-route="customers">
        <span class="tab-icon">❤️</span><span class="tab-label">熟客</span>
      </a>
      <a class="tab-item" data-route="copy">
        <span class="tab-icon">✍️</span><span class="tab-label">文案</span>
      </a>
      <a class="tab-item" data-route="books">
        <span class="tab-icon">📒</span><span class="tab-label">账本</span>
      </a>
      <a class="tab-item" data-route="store">
        <span class="tab-icon">🏪</span><span class="tab-label">单店</span>
      </a>
      <a class="tab-item" data-route="more">
        <span class="tab-icon">☰</span><span class="tab-label">更多</span>
      </a>
    </nav>

    <div class="more-mask" id="moreMask"></div>
    <div class="more-drawer" id="moreDrawer">
      <div class="more-title">更多功能</div>
      <div class="more-item" data-route="finance"><span class="more-icon">💰</span><span>财务</span><span class="more-sub">现金流 · 预算 · 赊账</span></div>
      <div class="more-item" data-route="stock"><span class="more-icon">📦</span><span>库存</span><span class="more-sub">进销存 · 补货预警</span></div>
      <div class="more-item" data-route="invoice"><span class="more-icon">🧾</span><span>发票</span><span class="more-sub">销项进项台账</span></div>
      <div class="more-item" data-route="settings"><span class="more-icon">⚙️</span><span>设置</span><span class="more-sub">支付账户 · 数据同步</span></div>
    </div>
  </div>

  <script src="/static/js/core.js?v=6"></script>
  <script src="/static/js/speech.js?v=6"></script>
  <script src="/static/js/pages/home.js?v=6"></script>
  <script src="/static/js/pages/customers.js?v=6"></script>
  <script src="/static/js/pages/copy.js?v=6"></script>
  <script src="/static/js/pages/books.js?v=6"></script>
  <script src="/static/js/pages/store.js?v=6"></script>
  <script src="/static/js/pages/finance.js?v=6"></script>
  <script src="/static/js/pages/stock.js?v=6"></script>
  <script src="/static/js/pages/invoice.js?v=6"></script>
  <script src="/static/js/pages/settings.js?v=6"></script>
  <script src="/static/js/init.js?v=6"></script>
</body>
</html>
