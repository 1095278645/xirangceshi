name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: 单元/集成测试 + 演示自检
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: server/requirements.lock

      - name: 安装依赖（锁定版本）
        run: pip install -r server/requirements.lock pytest

      - name: 单元/集成测试
        working-directory: server
        run: python -m pytest -q

      - name: 灌入演示数据
        working-directory: server
        run: python ../scripts/seed_demo_data.py --force

      - name: 演示前自检（接口契约 / 页面一致性 / 演示数据 / 演示配置）
        working-directory: server
        run: python ../scripts/mp_demo_check.py

      - name: 小程序接口契约
        working-directory: server
        run: python scripts/check_mp_api.py

      - name: 小程序页面静态检查
        working-directory: server
        run: python scripts/check_mp_pages.py

      - name: 网页端页面静态检查
        working-directory: server
        run: python scripts/check_web_pages.py

  web-render:
    name: 网页端渲染试跑（Node）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 在 Node 中试跑全部渲染函数
        working-directory: server
        run: node scripts/check_web_render.js

  docker:
    name: Docker 镜像构建
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 构建镜像
        run: docker build -t ai-shopkeeper:ci .
